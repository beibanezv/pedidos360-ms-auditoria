# Pedidos360 - ms-auditoria (desarrollo local)
server.port=8086

# Base propia (una por microservicio, como en la Eval 1).
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5435/pedidos360_auditoria}
spring.datasource.username=${DATASOURCE_USER:pedidos360}
spring.datasource.password=${DATASOURCE_PASSWORD:pedidos360}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Broker RabbitMQ: el clúster de ms-admin/docker/rabbitmq-cluster (nodo 1).
# En AWS se cambia RABBITMQ_HOST por la IP privada de la EC2 p360-rabbit.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# El consumidor usa Channel + basicAck/basicNack explícitos.
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1

# Entra ID: la bitacora global es solo para administracion. Issuer v1 exacto y
# audiencia de la app; en AWS se inyectan AZURE_TENANT_ID y AZURE_AUDIENCE.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/
azure.tenant-id=${AZURE_TENANT_ID:e5372bf0-c5e3-4286-887c-79069f209c1f}
azure.audience=${AZURE_AUDIENCE:api://446c57cb-aba2-4b7a-ab01-6f2e6af7d35c}

# Origenes CORS exactos, coma-separados. Sin wildcard ni cookies.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
